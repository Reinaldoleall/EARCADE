<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogando...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            display: flex; 
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .emulator-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        
        #emulator {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100vh;
        }
        
        .controls-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 1000;
        }
        
        .controls-bar button {
            padding: 10px 20px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .controls-bar button:hover {
            background: #f40612;
        }
        
        /* Controles de toque para mobile */
        .touch-controls {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 0;
            right: 0;
            padding: 10px;
            justify-content: space-between;
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            .touch-controls {
                display: flex;
            }
        }
        
        .touch-controls div {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        
        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: none;
        }
        
        .touch-btn:active {
            background: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="emulator-container">
        <div id="emulator"></div>
    </div>
    
    <div class="controls-bar">
        <button onclick="goBack()">⬅ Voltar</button>
        <button onclick="toggleFullscreen()">⛶ Tela Cheia</button>
    </div>
    
    <script src="js/emulator.js"></script>
</body>
</html>
